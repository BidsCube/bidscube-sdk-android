name: Fast Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: { }

jobs:
  build:
    name: Build + Release
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve BidscubeVersion for Gradle
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          elif [ -f version.properties ]; then
            VER=$(grep -E '^bidscube.version=' version.properties | cut -d= -f2- | tr -d '\r')
          else
            VER=$(grep -E '^bidscube.version=' gradle.properties.example | cut -d= -f2- | tr -d '\r' || true)
          fi
          if [ -z "$VER" ]; then
            echo "Could not resolve bidscube.version from tag, version.properties, or gradle.properties.example"
            exit 1
          fi
          echo "BidscubeVersion=$VER" >> "$GITHUB_ENV"
          echo "Resolved BidscubeVersion=$VER"

      - name: Prepare local Gradle properties (no secrets)
        run: cp gradle.properties.example gradle.properties

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute for Gradle wrapper (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Made gradlew executable"
          else
            echo "No gradlew in repository root; skipping chmod"
          fi

      - name: Ensure Gradle is available (if no gradlew)
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "No gradlew detected — installing Gradle on runner"
            sudo apt-get update -y
            sudo apt-get install -y wget unzip curl
            GRADLE_VER=8.11.1
            GRADLE_ZIP=gradle-${GRADLE_VER}-bin.zip
            wget https://services.gradle.org/distributions/${GRADLE_ZIP} -P /tmp
            sudo unzip -o /tmp/${GRADLE_ZIP} -d /opt/gradle
            echo "GRADLE_HOME=/opt/gradle/gradle-${GRADLE_VER}" >> $GITHUB_ENV
            echo "PATH=/opt/gradle/gradle-${GRADLE_VER}/bin:$PATH" >> $GITHUB_ENV
            echo "Installed Gradle ${GRADLE_VER} to /opt/gradle"
          else
            echo "gradlew present; skipping Gradle install"
          fi

      - name: Install Android SDK command-line tools and packages (if needed)
        run: |
          if [ -n "$ANDROID_HOME" ] || [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "ANDROID_HOME or ANDROID_SDK_ROOT already set; skipping SDK install"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            exit 0
          fi

          LOCAL_PROP_FILE="local.properties"
          LOCAL_SDK_DIR=""
          if [ -f "$LOCAL_PROP_FILE" ]; then
            echo "Found local.properties; checking sdk.dir"
            LOCAL_SDK_DIR=$(grep -E '^sdk.dir=' "$LOCAL_PROP_FILE" | cut -d'=' -f2- | tr -d '\r' || true)
            if [ -n "$LOCAL_SDK_DIR" ]; then
              echo "local.properties sdk.dir = $LOCAL_SDK_DIR"
              if echo "$LOCAL_SDK_DIR" | grep -E '^[A-Za-z]:\\' >/dev/null 2>&1; then
                WIN_PATH="$LOCAL_SDK_DIR"
                DRIVE=$(echo "$WIN_PATH" | cut -c1 | tr '[:upper:]' '[:lower:]')
                REST=$(echo "$WIN_PATH" | cut -c3- | sed 's|\\|/|g')
                CHECK_PATH="/mnt/${DRIVE}/${REST}"
              else
                CHECK_PATH="$LOCAL_SDK_DIR"
              fi

              if [ -d "$CHECK_PATH" ]; then
                echo "local.properties sdk.dir points to existing directory ($CHECK_PATH). Will use that and skip SDK install."
                echo "ANDROID_SDK_ROOT=$CHECK_PATH" >> $GITHUB_ENV
                echo "ANDROID_HOME=$CHECK_PATH" >> $GITHUB_ENV
                echo "PATH=$CHECK_PATH/platform-tools:$PATH" >> $GITHUB_ENV
                exit 0
              else
                echo "local.properties sdk.dir does not exist on runner ($CHECK_PATH); proceeding to install Android SDK and override local.properties"
              fi
            else
              echo "local.properties has no sdk.dir; will install Android SDK and write local.properties"
            fi
          else
            echo "No local.properties found; will install Android SDK"
          fi

          echo "Installing Android command-line tools and SDK packages"
          sudo apt-get update -y
          sudo apt-get install -y wget unzip lib32z1 lib32stdc++6

          ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT"

          TMP_ZIP="/tmp/commandline-tools.zip"
          CMDLINE_URL="https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          wget -q "$CMDLINE_URL" -O "$TMP_ZIP"
          unzip -q "$TMP_ZIP" -d /tmp/cmdline-tools
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools/* "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || {
            echo "Failed to install Android SDK packages (API 36)"
            exit 1
          }

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "Wrote local.properties with sdk.dir=$ANDROID_SDK_ROOT"

          echo "Android SDK installed to $ANDROID_SDK_ROOT"

      - name: Print Android env (debug)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "PATH=$PATH"
          echo "Which sdkmanager: $(which sdkmanager || true)"

      - name: Build AAR, validate publication, write local Maven repo (no credentials)
        env:
          BidscubeVersion: ${{ env.BidscubeVersion }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean :sdk:publishAllPublicationsToDistRepository --no-daemon --stacktrace
          else
            gradle clean :sdk:publishAllPublicationsToDistRepository --no-daemon --stacktrace
          fi

      - name: Verify built artifacts
        run: |
          set -e
          echo "Verifying built artifacts..."
          if compgen -G "sdk/build/outputs/aar/*.aar" > /dev/null; then
            echo "Found AAR in sdk/build/outputs/aar"
          elif compgen -G "build/outputs/aar/*.aar" > /dev/null; then
            echo "Found AAR in build/outputs/aar"
          else
            echo "Error: no AAR found in sdk/build/outputs/aar or build/outputs/aar"
            ls -la
            exit 1
          fi

          SRC=$(find sdk/build -type f -name '*sources*.jar' -print -quit 2>/dev/null || true)
          if [ -z "$SRC" ]; then
            echo "Error: no sources JAR under sdk/build (run :sdk:releaseSourcesJar)"
            find sdk/build -type f -name '*.jar' 2>/dev/null | head -30 || true
            exit 1
          fi
          echo "Found sources jar: $SRC"

          DOC=$(find sdk/build -type f -name '*javadoc*.jar' -print -quit 2>/dev/null || true)
          if [ -z "$DOC" ]; then
            echo "Error: no javadoc JAR under sdk/build (run :sdk:javaDocReleaseJar)"
            find sdk/build -type f -name '*.jar' 2>/dev/null | head -30 || true
            exit 1
          fi
          echo "Found javadoc jar: $DOC"

          MAVEN="${GITHUB_WORKSPACE}/build/maven-repo"
          if [ ! -d "$MAVEN" ]; then
            echo "Error: expected Maven layout at $MAVEN after publishAllPublicationsToDistRepository"
            exit 1
          fi
          echo "Maven repo layout present under build/maven-repo"

      - name: Zip Maven-style repository (internal mirrors / flat unzip)
        env:
          BidscubeVersion: ${{ env.BidscubeVersion }}
        run: |
          set -e
          MAVEN="${GITHUB_WORKSPACE}/build/maven-repo"
          OUT="bidscube-sdk-maven-${BidscubeVersion}.zip"
          (cd "$MAVEN" && zip -rq "$GITHUB_WORKSPACE/$OUT" .)
          echo "Created $OUT ($(du -h "$GITHUB_WORKSPACE/$OUT" | cut -f1))"
          echo "MAVEN_ZIP_NAME=$OUT" >> $GITHUB_ENV

      - name: Detect optional GitHub release token
        id: release_token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -n "$RELEASE_TOKEN" ]; then
            echo "has_release_token=yes" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_token=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload CI artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: bidscube-sdk-${{ env.BidscubeVersion }}
          path: |
            sdk/build/outputs/aar/*.aar
            build/maven-repo/**/*
            bidscube-sdk-maven-*.zip
          if-no-files-found: error

      - name: Create GitHub Release with assets
        if: ${{ steps.release_token.outputs.has_release_token == 'yes' }}
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Automated release for ${{ github.ref_name }}.

            **Distribution (no Maven Central):**
            - AAR: `sdk-release.aar` (or attached `sdk-*.aar`)
            - Maven layout: `bidscube-sdk-maven-*.zip` — unzip to an HTTP-accessible directory and use `maven { url = uri("...") }`, or copy into your internal Nexus/Artifactory.

            **Integrate as module:** `implementation(project(":sdk"))` from a checkout.

            **JitPack:** see [JitPack](https://jitpack.io) for `com.github.BidsCube:bidscube-sdk-android` (tag / commit).
          files: |
            sdk/build/outputs/aar/*.aar
            bidscube-sdk-maven-*.zip

      - name: Save artifacts locally when no release token
        if: ${{ steps.release_token.outputs.has_release_token != 'yes' }}
        run: |
          echo "No RELEASE_TOKEN secret; artifacts are only in the workflow job (upload-artifact) and under ./release_artifacts"
          mkdir -p release_artifacts
          cp -v sdk/build/outputs/aar/*.aar release_artifacts/ || true
          cp -v bidscube-sdk-maven-*.zip release_artifacts/ || true
          cp -v sdk/build/libs/*.jar release_artifacts/ 2>/dev/null || true
          ls -la release_artifacts || true

      - name: Done
        run: echo "Publish job finished (no Sonatype credentials required)."
