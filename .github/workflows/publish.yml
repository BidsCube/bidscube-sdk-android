name: Fast Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build + Release
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 33

      - name: Build AAR, sources and javadoc JARs
        run: |
          ./gradlew clean :sdk:assembleRelease :sdk:sourcesJar :sdk:javadocJar --no-daemon --stacktrace

      - name: Upload artifacts for later download
        uses: actions/upload-artifact@v4
        with:
          name: sdk-artifacts
          path: |
            sdk/build/outputs/aar/*.aar
            sdk/build/libs/*.jar
            build/outputs/aar/*.aar
            build/libs/*.jar

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: "Automated release generated by workflow"

      - name: Attach AAR to Release
        if: always()
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: |
            sdk/build/outputs/aar/sdk-release.aar
            build/outputs/aar/sdk-release.aar
          asset_name: sdk-${{ github.ref_name }}.aar
          asset_content_type: application/zip

      - name: Attach Sources JAR to Release
        if: always()
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: |
            sdk/build/libs/sdk-sources.jar
            build/libs/sdk-sources.jar
          asset_name: sdk-sources-${{ github.ref_name }}.jar
          asset_content_type: application/java-archive

      - name: Attach Javadoc JAR to Release
        if: always()
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: |
            sdk/build/libs/sdk-javadoc.jar
            build/libs/sdk-javadoc.jar
          asset_name: sdk-javadoc-${{ github.ref_name }}.jar
          asset_content_type: application/java-archive

      # --- New pre-deploy verification and settings copy steps ---
      - name: Verify built artifacts
        run: |
          set -e
          echo "Verifying built artifacts..."
          # check for AAR
          if compgen -G "sdk/build/outputs/aar/*.aar" > /dev/null; then
            echo "Found AAR in sdk/build/outputs/aar"
          elif compgen -G "build/outputs/aar/*.aar" > /dev/null; then
            echo "Found AAR in build/outputs/aar"
          else
            echo "Error: no AAR found in sdk/build/outputs/aar or build/outputs/aar"
            ls -la
            exit 1
          fi

          # check for sources and javadoc JARs
          if [ ! -f "sdk/build/libs/sdk-sources.jar" ] && [ ! -f "build/libs/sdk-sources.jar" ]; then
            echo "Error: sources JAR not found"
            ls -la sdk/build/libs || true
            ls -la build/libs || true
            exit 1
          fi
          if [ ! -f "sdk/build/libs/sdk-javadoc.jar" ] && [ ! -f "build/libs/sdk-javadoc.jar" ]; then
            echo "Error: javadoc JAR not found"
            ls -la sdk/build/libs || true
            ls -la build/libs || true
            exit 1
          fi

      - name: Prepare Maven settings (copy repository settings.xml)
        run: |
          set -e
          mkdir -p "$HOME/.m2"
          if [ -f "settings.xml" ]; then
            cp -v settings.xml "$HOME/.m2/settings.xml"
            echo "Copied repository settings.xml to $HOME/.m2/settings.xml"
          else
            echo "No settings.xml found in repository root; continuing — credentials may come from gradle.properties or secrets"
          fi

      - name: Load Maven credentials from gradle.properties (if present)
        id: load_maven_creds
        run: |
          MAVEN_USER=""
          MAVEN_PASS=""
          if [ -f "gradle.properties" ]; then
            MAVEN_USER=$(grep -E '^mavenCentralUsername=' gradle.properties | cut -d'=' -f2- | tr -d '\r') || true
            MAVEN_PASS=$(grep -E '^mavenCentralPassword=' gradle.properties | cut -d'=' -f2- | tr -d '\r') || true
          fi
          echo "maven_user=$MAVEN_USER" >> $GITHUB_OUTPUT
          echo "maven_pass=$MAVEN_PASS" >> $GITHUB_OUTPUT

      - name: Import GPG key (if provided)
        env:
          GPG_PRIVATE_BASE64: ${{ secrets.GPG_PRIVATE_BASE64 }}
        run: |
          if [ -n "$GPG_PRIVATE_BASE64" ]; then
            echo "$GPG_PRIVATE_BASE64" | base64 --decode > private-gpg.asc
            gpg --batch --import private-gpg.asc || true
            echo "Imported GPG key"
          else
            echo "No GPG_PRIVATE_BASE64 secret provided; skipping GPG import"
          fi

      - name: Install Maven and deploy
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          echo "Preparing to deploy..."

          # Prefer credentials from gradle.properties (loaded into step outputs), then fall back to repository secrets
          USER="${{ steps.load_maven_creds.outputs.maven_user }}"
          PASS="${{ steps.load_maven_creds.outputs.maven_pass }}"

          if [ -z "$USER" ]; then
            USER="${{ secrets.OSSRH_USERNAME }}"
          fi
          if [ -z "$PASS" ]; then
            PASS="${{ secrets.OSSRH_PASSWORD }}"
          fi

          if [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "No Maven credentials found in gradle.properties or repository secrets. Skipping deploy."
            echo "Set mavenCentralUsername/mavenCentralPassword in gradle.properties, or set OSSRH_USERNAME/OSSRH_PASSWORD secrets."
            exit 1
          fi

          echo "Using Maven user: ${USER}"

          # If we have credentials, ensure settings.xml contains them — overwrite copied settings only if creds provided
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/settings.xml" <<SETTINGS
<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
          xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
  <servers>
    <server>
      <id>central</id>
      <username>${USER}</username>
      <password>${PASS}</password>
    </server>
  </servers>
</settings>
SETTINGS

          echo "Installed Maven settings with provided credentials"

          echo "Installing Maven"
          sudo apt-get update -y
          sudo apt-get install -y maven gnupg

          export GPG_PASSPHRASE="$GPG_PASSPHRASE"
          mvn -B -s "$HOME/.m2/settings.xml" -Prelease -Drelease=true -DskipTests deploy
